name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Пакет 'tools' (ставится по умолчанию) больше не существует в sdkmanager —
      # из-за него шаг падал с "Failed to find package 'tools'". Пропускаем его,
      # а нужные пакеты ставим явно ниже.
      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Шрифты дизайна (Unbounded + Manrope). Если не скачались — приложение соберётся с системным шрифтом.
      - name: Download fonts
        continue-on-error: true
        run: |
          mkdir -p app/src/main/res/font
          curl -fsSL -o app/src/main/res/font/unbounded.ttf "https://github.com/google/fonts/raw/main/ofl/unbounded/Unbounded%5Bwght%5D.ttf"
          curl -fsSL -o app/src/main/res/font/manrope.ttf "https://github.com/google/fonts/raw/main/ofl/manrope/Manrope%5Bwght%5D.ttf"
          ls -la app/src/main/res/font

      # Своя подпись — необязательна. Без секретов APK подписывается debug-ключом.
      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Используется свой keystore"
          else
            echo "Секреты подписи не заданы — debug-подпись"
          fi

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      # Диагностика: если сборка упала, показываем, какие классы yt-dlp реально лежат в библиотеке.
      - name: Debug youtubedl classes
        if: failure()
        run: |
          find ~/.gradle -path "*junkfood02*" \( -name "*.aar" -o -name "*.jar" \) | while read f; do
            echo "== $f"
            unzip -l "$f" | grep -i "\.class\|classes.jar" | head -20
            tmp=$(mktemp -d); unzip -q -o "$f" classes.jar -d "$tmp" 2>/dev/null && unzip -l "$tmp/classes.jar" | grep -i "YoutubeDL" | head -20
          done || true

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk HXT-Music.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HXT-Music-apk
          path: HXT-Music.apk

      - name: Publish release (по тегу v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: HXT-Music.apk
