name: Build APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Пакет 'tools' (ставится по умолчанию) больше не существует в sdkmanager —
      # из-за него шаг падал с "Failed to find package 'tools'". Пропускаем его,
      # а нужные пакеты ставим явно ниже.
      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Шрифты дизайна (Unbounded + Manrope). Manrope нужен для текстов песен.
      # Порядок: файл из репозитория (если лежит в app/src/main/res/font) → кеш → скачивание
      # с трёх зеркал с повторами. Каждый файл проверяется (размер + сигнатура TTF).
      # Если шрифт так и не получен — сборка падает, чтобы не выпустить APK с тонким системным шрифтом.
      - name: Cache fonts
        uses: actions/cache@v4
        with:
          path: app/src/main/res/font
          key: hxt-fonts-v1

      - name: Download fonts
        run: |
          dir=app/src/main/res/font
          mkdir -p "$dir"

          valid() {
            [ -s "$1" ] || return 1
            [ "$(stat -c %s "$1")" -gt 100000 ] || return 1
            case "$(head -c 4 "$1" | od -An -tx1 | tr -d ' \n')" in
              00010000|74727565) return 0 ;;   # сигнатуры TrueType
              *) return 1 ;;
            esac
          }

          fetch() {   # fetch <имя> <путь внутри google/fonts/ofl>
            local out="$dir/$1.ttf" rel="$2"
            if valid "$out"; then echo "$1: уже есть ($(stat -c %s "$out") байт)"; return 0; fi
            rm -f "$out"
            for url in \
              "https://github.com/google/fonts/raw/main/ofl/$rel" \
              "https://raw.githubusercontent.com/google/fonts/main/ofl/$rel" \
              "https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/$rel"; do
              echo "$1: $url"
              if curl -fsSL --retry 4 --retry-delay 3 --retry-all-errors \
                   --connect-timeout 15 --max-time 120 -o "$out.tmp" "$url" && valid "$out.tmp"; then
                mv "$out.tmp" "$out"; echo "$1: скачан"; return 0
              fi
              rm -f "$out.tmp"
            done
            echo "::error::Не удалось получить шрифт $1 ни с одного зеркала"
            return 1
          }

          fetch manrope   'manrope/Manrope%5Bwght%5D.ttf'
          fetch unbounded 'unbounded/Unbounded%5Bwght%5D.ttf'
          ls -la "$dir"

      # Своя подпись — необязательна. Без секретов APK подписывается debug-ключом.
      - name: Prepare signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "Используется свой keystore"
          else
            echo "Секреты подписи не заданы — debug-подпись"
          fi

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      # Диагностика: если сборка упала, показываем, подключилась ли библиотека yt-dlp и какие классы в ней есть.
      - name: Debug youtubedl classes
        if: failure()
        run: |
          echo "GRADLE_USER_HOME=$GRADLE_USER_HOME"
          echo "--- dependencies (compile classpath) ---"
          gradle :app:dependencies --configuration releaseCompileClasspath --no-daemon 2>&1 | grep -i "youtubedl\|junkfood\|FAILED" || echo "в compile classpath библиотеки нет"
          echo "--- files ---"
          find / \( -path /proc -o -path /sys \) -prune -o -path "*junkfood02*" \( -name "*.aar" -o -name "*.jar" -o -name "*.pom" \) -print 2>/dev/null | head -20
          echo "--- classes ---"
          find / \( -path /proc -o -path /sys \) -prune -o -path "*junkfood02*" -name "*.aar" -print 2>/dev/null | while read f; do
            echo "== $f"
            tmp=$(mktemp -d)
            unzip -q -o "$f" classes.jar -d "$tmp" 2>/dev/null && unzip -l "$tmp/classes.jar" | grep -i "YoutubeDL" | head -20
          done
          true

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk HXT-Music.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HXT-Music-apk
          path: HXT-Music.apk

      - name: Publish release (по тегу v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: HXT-Music.apk
